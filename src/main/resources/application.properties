spring.application.name=smart-campus-backend

# Temporary local database for the first successful backend run.
# We will connect MySQL after the backend API is confirmed working.
spring.datasource.url=jdbc:h2:file:./data/smartcampusdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
